<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distress Detection</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
</head>
<body>
{% include 'navbar.html' %}
<main>
    <div class="card">
        <span class="badge"><i class="fa-solid fa-image"></i> Upload a photo</span>
        <h1>Classify a road surface</h1>
        <p class="intro">
            JPG or PNG. The model looks for potholes, patching, rutting, ravelling, and cracking.
        </p>

        <form action="{{ url_for('predict') }}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" class="dropzone" id="file-upload" required>
            <label for="file-upload" class="dropzone-label" id="dropzone-label">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span id="dropzone-text">Choose an image</span>
                <span class="dropzone-hint" id="dropzone-hint">JPG or PNG</span>
            </label>
            <button type="submit" class="btn btn--primary">
                <i class="fa-solid fa-magnifying-glass"></i> Analyze image
            </button>
        </form>
    </div>
</main>
{% include 'footer.html' %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
